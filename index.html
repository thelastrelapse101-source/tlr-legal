<style>
  :root {
    --ink: #1c1e2e;
    --muted: #5a5e75;
    --accent: #5f57c7;
    --rule: #e4e2f0;
    --bg: #fbfaff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; }
  .brand {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px;
    letter-spacing: 0.02em; color: var(--ink); text-decoration: none;
  }
  .brand .strike { color: inherit; text-decoration: line-through; text-decoration-color: #d64545; text-decoration-thickness: 2.5px; }
  nav.docs { margin-top: 10px; font-size: 13px; color: var(--muted); }
  nav.docs a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
  nav.docs a:hover { color: var(--accent); border-color: var(--accent); }
  nav.docs span.here { color: var(--accent); font-weight: 500; }
  h1 {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: clamp(30px, 6vw, 42px); line-height: 1.1;
    margin: 40px 0 6px; letter-spacing: -0.01em;
  }
  h1 + p strong { color: var(--muted); font-weight: 500; font-size: 14px; }
  h2 {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px;
    margin: 44px 0 12px; padding-top: 22px; border-top: 1px solid var(--rule);
  }
  h3 { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 16px; margin: 26px 0 8px; }
  p, li { color: var(--ink); }
  li { margin: 6px 0; }
  strong { font-weight: 700; }
  a { color: var(--accent); }
  footer {
    margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--rule);
    font-size: 13px; color: var(--muted);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e7f4; --muted: #a2a1bd; --accent: #9d95ff; --rule: #2b2b40; --bg: #101018; }
  }
</style>
